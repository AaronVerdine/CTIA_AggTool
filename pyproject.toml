[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aggtool"
version = "1.0.0"
description = "Aggregate and reconcile carrier short code reports, as a CLI and a serverless AWS service."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "mangum>=0.19",
  "aws-lambda-powertools[tracer]>=3.0",
  "boto3>=1.35",
]

[project.optional-dependencies]
local = ["uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev = [
  "aggtool[local]",
  "pytest>=8",
  "pytest-cov>=5",
  "moto[s3,sqs,dynamodb]>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs",
  "types-PyYAML",
  "types-openpyxl",
  "boto3-stubs[s3,sqs,dynamodb]",
]

[project.scripts]
aggtool = "aggtool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aggtool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=aggtool --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mangum.*", "moto.*"]
ignore_missing_imports = true
