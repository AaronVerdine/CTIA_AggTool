name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: coverage
          path: coverage.xml

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Placeholder bundle for validation
        run: mkdir -p build && touch build/lambda.zip
      - run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for stack in infra/terraform infra/bootstrap; do
            terraform -chdir=$stack init -backend=false -input=false
            terraform -chdir=$stack validate
          done

  iac-security:
    name: IaC security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aggtool:ci .
      - name: Smoke test
        run: |
          docker run -d --name agg -p 8000:8000 aggtool:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs agg; exit 1

  bundle:
    name: Lambda bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv .venv && make bundle
      - name: Check size limits
        run: |
          unzipped=$(du -sm build/lambda | cut -f1)
          zipped=$(du -sm build/lambda.zip | cut -f1)
          echo "unzipped=${unzipped}MB zipped=${zipped}MB"
          test "$unzipped" -lt 250 && test "$zipped" -lt 50
